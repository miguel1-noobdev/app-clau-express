version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: claudapp-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-claudapp}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-claudapp123}
      MONGO_INITDB_DATABASE: claudapp
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - claudapp-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  claudapp-network:
    driver: bridge
